<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plant Diseases — Jordan</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="progress-wrap"><div id="progressBar"></div></div>

  <header>
    <nav class="nav">
      <div class="brand"><span class="gem"></span> <span>Plant Diseases</span></div>
      <button class="menu-toggle" data-menu-toggle aria-label="Toggle menu">☰</button>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="agriculture.html">Agriculture</a>
        <a href="irrigation.html">Irrigation</a>
        <a href="crops.html">Crops</a>
        <a href="plants.html">Plants</a>
        <a href="vertical.html">Vertical Farming</a>
        <a href="diseases.html">Plant Diseases</a>
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌓</button>
      </div>
    </nav>
  </header>

  <main>
    <h1 data-animate>Plant Diseases Affecting Jordan</h1>
    <div class="table-wrap" data-animate>
      <table class="table" id="diseaseTable">
        <thead><tr><th>Name</th><th>Affected Crop</th><th>Type</th><th>Notes</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <footer>© 2025 FoodSecure Jordan</footer>

  <script src="assets/script.js"></script>
  <script>
    loadData().then(data=>{
      const tbody = document.querySelector('#diseaseTable tbody');
      tbody.innerHTML = data.plantDiseases.map(d=>`
        <tr>
          <td>${d.name}</td>
          <td>${d.crop}</td>
          <td><span class="badge">${d.type}</span></td>
          <td>${d.notes}</td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
