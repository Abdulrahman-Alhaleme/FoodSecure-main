<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vertical Farming — Jordan</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="progress-wrap"><div id="progressBar"></div></div>

  <header>
    <nav class="nav">
      <div class="brand"><span class="gem"></span> <span>Vertical Farming</span></div>
      <button class="menu-toggle" data-menu-toggle aria-label="Toggle menu">☰</button>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="agriculture.html">Agriculture</a>
        <a href="irrigation.html">Irrigation</a>
        <a href="crops.html">Crops</a>
        <a href="plants.html">Plants</a>
        <a href="vertical.html">Vertical Farming</a>
        <a href="diseases.html">Plant Diseases</a>
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌓</button>
      </div>
    </nav>
  </header>

  <main>
    <h1 data-animate>Vertical Farming in Jordan</h1>
    <h2 data-animate>Benefits</h2>
    <ul class="list" id="vf-benefits"></ul>
    <h2 data-animate>Challenges</h2>
    <ul class="list" id="vf-challenges"></ul>
  </main>

  <footer>© 2025 FoodSecure Jordan</footer>

  <script src="assets/script.js"></script>
  <script>
    loadData().then(data=>{
      document.getElementById('vf-benefits').innerHTML =
        data.verticalFarming.benefits.map(b=>`<li>${b}</li>`).join('');
      document.getElementById('vf-challenges').innerHTML =
        data.verticalFarming.challenges.map(c=>`<li>${c}</li>`).join('');
    });
  </script>
</body>
</html>
