<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Irrigation — Jordan</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="progress-wrap"><div id="progressBar"></div></div>

  <header>
    <nav class="nav">
      <div class="brand"><span class="gem"></span> <span>Irrigation</span></div>
      <button class="menu-toggle" data-menu-toggle aria-label="Toggle menu">☰</button>
      <div class="links">
        <a href="index.html">Home</a>
        <a href="agriculture.html">Agriculture</a>
        <a href="irrigation.html">Irrigation</a>
        <a href="crops.html">Crops</a>
        <a href="plants.html">Plants</a>
        <a href="vertical.html">Vertical Farming</a>
        <a href="diseases.html">Plant Diseases</a>
         <a href="suggestions.html">Suggestions</a>
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">🌓</button>
      </div>
    </nav>
  </header>

  <main>
    <h1 data-animate>Irrigation Systems</h1>
    <p data-animate>Breakdown of irrigation methods used in Jordan (illustrative figures from <code>assets/data.json</code>).</p>

    <div class="chart-box" data-animate>
      <canvas id="irrigationChart"></canvas>
    </div>
  </main>

  <footer>© 2025 FoodSecure Jordan</footer>

  <script src="assets/script.js"></script>
  <script>
    loadData().then(data=>{
      const labels = data.irrigation.systems.map(s=>s.label);
      const values = data.irrigation.systems.map(s=>s.sharePercent);
      const ctx = document.getElementById('irrigationChart').getContext('2d');
      makeChart(ctx,{
        type:'bar',
        data:{
          labels,
          datasets:[{
            label:'% Share',
            data: values,
            backgroundColor:['#10b981','#22d3ee','#6366f1']
          }]
        },
        options:{
          scales:{ y:{ beginAtZero:true, max:100 } }
        }
      });
    });
  </script>
</body>
</html>
